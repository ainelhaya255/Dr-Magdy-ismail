name: Build APK

# زي دوايا بالظبط: أي تعديل بيبني ملف APK لوحده.
#   • على main: بيتنشر في Releases على لينك ثابت (…/releases/latest/download/dr-magdy.apk)
#   • على أي فرع تاني: بيتبني ويتختبر بس، والملف بيبقى في صفحة الـ Actions (Artifacts)
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # الأسرار (Settings → Secrets and variables → Actions):
      #   APP_TOKEN     نفس توكن خدمة دوايا (appToken في lib/config.dart بتاع دوايا)
      #   KEYSTORE_B64  مفتاح التوقيع (base64) — علشان كل نسخة تتثبّت فوق القديمة
      - name: Signing key (from secrets)
        id: key
        env:
          K: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -n "$K" ]; then umask 077; printf '%s' "$K" | base64 -d > tool/drmagdy.keystore; echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::warning::KEYSTORE_B64 secret missing — temporary signing key"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: Check the web app (JavaScript syntax)
        env:
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
        run: |
          python3 tool/bundle_web.py
          python3 - <<'EOF'
          s = open('assets/app/app.html', encoding='utf-8').read()
          open('/tmp/app.js', 'w', encoding='utf-8').write(s[s.rindex('<script>') + 8:s.rindex('</script>')])
          EOF
          node --check /tmp/app.js
          node --check web/faq.js
          node --check cloudflare/src/index.js

      - name: Generate Android files
        run: |
          flutter create . --project-name drmagdy --org com.drmagdy --platforms android
          rm -f test/widget_test.dart

      - name: Patch Android setup (name, internet, links, signing)
        run: python3 tool/patch_android.py

      - name: Get packages
        run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: flutter analyze --no-fatal-infos lib

      - name: Build APK
        run: flutter build apk --release

      # كل نسخة لازم تتوقّع بنفس المفتاح، وإلا التحديث ما بيتثبّتش فوق القديم.
      - name: Check the signing key
        if: steps.key.outputs.ok == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee certs.txt
          grep -qi "SHA-256 digest: $(cat tool/signing-sha256.txt)" certs.txt || {
            echo "::error::APK is not signed with tool/drmagdy.keystore"; exit 1; }

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk dr-magdy.apk

      - name: Clean up the key
        if: always()
        run: rm -f tool/drmagdy.keystore

      - name: Publish APK (direct download link)
        if: github.ref == 'refs/heads/main' && steps.key.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: د. مجدي — آخر نسخة
          body: "نزّلي ملف dr-magdy.apk وثبّتيه على الموبايل. لو عندك نسخة قديمة، الجديدة بتتثبّت فوقها وبياناتك بتفضل."
          files: dr-magdy.apk
          make_latest: true
          overwrite_files: true

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: dr-magdy-apk
          path: dr-magdy.apk
          retention-days: 30
